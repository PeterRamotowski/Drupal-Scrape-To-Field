services:
  scrape_to_field.scraper:
    class: Drupal\scrape_to_field\Service\WebScraperService
    arguments: ['@http_client', '@config.factory', '@scrape_to_field.user_agent', '@scrape_to_field.activity_logger', '@scrape_to_field.data_cleaning']

  scrape_to_field.manager:
    class: Drupal\scrape_to_field\Service\ScrapeFieldManager
    arguments: ['@entity_type.manager', '@scrape_to_field.scraper', '@scrape_to_field.activity_logger', '@scrape_to_field.content_sanitization', '@state']

  scrape_to_field.queue:
    class: Drupal\scrape_to_field\Service\QueueManager
    arguments: ['@entity_type.manager', '@queue', '@scrape_to_field.manager', '@scrape_to_field.activity_logger', '@config.factory', '@state']

  scrape_to_field.content_sanitization:
    class: Drupal\scrape_to_field\Service\ContentSanitizationService
    arguments: ['@config.factory']

  scrape_to_field.activity_logger:
    class: Drupal\scrape_to_field\Service\ScraperActivityLogger
    arguments: ['@logger.channel.scrape_to_field', '@current_user']

  scrape_to_field.user_agent:
    class: Drupal\scrape_to_field\Service\UserAgentService

  scrape_to_field.data_cleaning:
    class: Drupal\scrape_to_field\Service\DataCleaningService

  logger.channel.scrape_to_field:
    parent: logger.channel_base
    arguments: ['scrape_to_field']
