services:
  scrape_to_field.scraper:
    class: Drupal\scrape_to_field\Service\WebScraperService
    arguments: ['@scrape_to_field.http_client', '@scrape_to_field.dom_extractor', '@scrape_to_field.config_validator', '@scrape_to_field.activity_logger', '@scrape_to_field.data_cleaning']

  scrape_to_field.manager:
    class: Drupal\scrape_to_field\Service\ScrapeFieldManager
    arguments: ['@entity_type.manager', '@scrape_to_field.scraper', '@scrape_to_field.activity_logger', '@scrape_to_field.content_sanitization', '@scrape_to_field.state_repository', '@scrape_to_field.node_config_repository', '@scrape_to_field.field_value_writer', '@lock']

  scrape_to_field.queue:
    class: Drupal\scrape_to_field\Service\QueueManager
    arguments: ['@entity_type.manager', '@queue', '@scrape_to_field.activity_logger', '@config.factory', '@scrape_to_field.node_config_repository', '@scrape_to_field.state_repository']

  scrape_to_field.http_client:
    class: Drupal\scrape_to_field\Service\ScraperHttpClient
    arguments: ['@http_client', '@config.factory', '@scrape_to_field.user_agent', '@scrape_to_field.target_url_policy', '@scrape_to_field.rate_limiter']

  scrape_to_field.dom_extractor:
    class: Drupal\scrape_to_field\Service\DomContentExtractor
    arguments: ['@config.factory']

  scrape_to_field.config_validator:
    class: Drupal\scrape_to_field\Service\ScraperConfigValidator
    arguments: ['@scrape_to_field.target_url_policy']

  scrape_to_field.field_value_writer:
    class: Drupal\scrape_to_field\Service\FieldValueWriter
    arguments: ['@entity_type.manager', '@?Drupal\filter\FilterFormatRepositoryInterface']

  scrape_to_field.field_discovery:
    class: Drupal\scrape_to_field\Service\ScraperFieldDiscovery

  scrape_to_field.state_repository:
    class: Drupal\scrape_to_field\Repository\ScraperStateRepository
    arguments: ['@state', '@database']

  scrape_to_field.node_config_repository:
    class: Drupal\scrape_to_field\Repository\NodeScraperConfigRepository
    arguments: ['@scrape_to_field.activity_logger']

  scrape_to_field.content_sanitization:
    class: Drupal\scrape_to_field\Service\ContentSanitizationService
    arguments: ['@config.factory']

  scrape_to_field.activity_logger:
    class: Drupal\scrape_to_field\Service\ScraperActivityLogger
    arguments: ['@logger.channel.scrape_to_field', '@current_user']

  scrape_to_field.user_agent:
    class: Drupal\scrape_to_field\Service\UserAgentService

  scrape_to_field.data_cleaning:
    class: Drupal\scrape_to_field\Service\DataCleaningService

  scrape_to_field.target_url_policy:
    class: Drupal\scrape_to_field\Service\TargetUrlPolicy
    arguments: ['@config.factory']

  scrape_to_field.rate_limiter:
    class: Drupal\scrape_to_field\Service\ScrapeRateLimiter
    arguments: ['@state', '@datetime.time', '@config.factory', '@lock']

  scrape_to_field.hooks:
    class: Drupal\scrape_to_field\Hook\Hooks
    arguments: 
      - '@config.factory'
      - '@scrape_to_field.activity_logger'
      - '@scrape_to_field.queue'
      - '@keyvalue'
    tags:
      - { name: 'hook_event_subscriber' }

  logger.channel.scrape_to_field:
    parent: logger.channel_base
    arguments: ['scrape_to_field']
